<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<link rel="icon" type="image/png" href="img/logo.png">
<title>Control de Personal - METALES</title>
<script>try{document.documentElement.setAttribute("data-theme",localStorage.getItem("cp_tema")==="dark"?"dark":"light")}catch(e){document.documentElement.setAttribute("data-theme","light")}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: sticky plant-floor header with shift tabs; each view = toolbar + live content. Steel neutrals, cobalt accent, semaphore states. */
:root{
  --bg:#eef1f4; --surface:#ffffff; --surface2:#f6f8fa; --ink:#16202b; --muted:#4d5b6a; --line:#d5dbe2;
  --accent:#0f5f8c; --accent-ink:#ffffff; --accent-soft:#dcebf5;
  --ok:#1d7a46; --ok-soft:#dcf1e4; --warn:#9a6200; --warn-soft:#fbecc9; --bad:#b3261e; --bad-soft:#f8dedb;
  --info:#5b4bb5; --info-soft:#ebe7fa; --bar:#16202b; --bar-ink:#e7edf3;
  --c-a:#1d7a46; --c-r:#7cc49a; --c-f:#b3261e; --c-p:#d99a1e; --c-v:#6f5fc7; --c-i:#2f7fb5;
  --f-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f151b; --surface:#17202a; --surface2:#1c2632; --ink:#e5ebf1; --muted:#a9b6c3; --line:#2b3846;
  --accent:#4fa8d8; --accent-ink:#06131c; --accent-soft:#163246;
  --ok:#5cc98a; --ok-soft:#143323; --warn:#e8b04a; --warn-soft:#3a2c0f; --bad:#f07d74; --bad-soft:#3d1916;
  --info:#a99bf0; --info-soft:#2a2547; --bar:#0a0f14; --bar-ink:#e5ebf1;
  --c-a:#23804f; --c-r:#5fae82; --c-f:#c4443b; --c-p:#bd8820; --c-v:#8b7de0; --c-i:#4a9bd0; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f151b; --surface:#17202a; --surface2:#1c2632; --ink:#e5ebf1; --muted:#a9b6c3; --line:#2b3846;
  --accent:#4fa8d8; --accent-ink:#06131c; --accent-soft:#163246;
  --ok:#5cc98a; --ok-soft:#143323; --warn:#e8b04a; --warn-soft:#3a2c0f; --bad:#f07d74; --bad-soft:#3d1916;
  --info:#a99bf0; --info-soft:#2a2547; --bar:#0a0f14; --bar-ink:#e5ebf1;
  --c-a:#23804f; --c-r:#5fae82; --c-f:#c4443b; --c-p:#bd8820; --c-v:#8b7de0; --c-i:#4a9bd0; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45}
.wrap{max-width:1280px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
/* Menú lateral (mismo esquema que Surtido de Línea): marca, pestañas por rol y usuario; en celular pasa arriba */
.shell{display:flex;align-items:flex-start;min-height:100vh}
.side{background:var(--bar);color:var(--bar-ink);position:sticky;top:0;flex:0 0 236px;height:100vh;height:100dvh;display:flex;flex-direction:column;gap:18px;padding:calc(18px + env(safe-area-inset-top,0px)) 0 calc(16px + env(safe-area-inset-bottom,0px)) max(0px,env(safe-area-inset-left,0px));overflow-y:auto;z-index:20}
.side .brand{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;padding:0 12px 0 18px}
.brand-t{display:grid;gap:4px;min-width:0}
.brand-t .logo{width:34px;height:34px;object-fit:contain;border-radius:4px;background:#fff;padding:2px}
.side .brand h1{font-family:var(--f-display);font-size:23px;line-height:1.05;font-weight:700;text-transform:uppercase;letter-spacing:.04em;margin:0}
.side .brand .tag{font-family:var(--f-mono);font-size:11px;opacity:.65;line-height:1.4}
.side-toggle{flex:0 0 32px;width:32px;height:32px;display:grid;place-items:center;background:transparent;color:var(--bar-ink);border:1px solid #ffffff40;border-radius:4px;cursor:pointer;opacity:.8}
.side-toggle:hover{opacity:1}.side-toggle svg{width:18px;height:18px}
nav.tabs{display:flex;flex-direction:column;gap:2px;flex:1}
nav.tabs button{position:relative;display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:transparent;color:var(--bar-ink);border:0;border-left:4px solid transparent;padding:10px 18px 10px 14px;font:600 16px var(--f-display);text-transform:uppercase;letter-spacing:.06em;cursor:pointer;opacity:.72}
nav.tabs button svg{width:18px;height:18px;flex:0 0 18px}
nav.tabs button[aria-current="page"]{opacity:1;border-left-color:var(--warn);background:#ffffff12}
nav.tabs button:hover{opacity:1;background:#ffffff0a}
.side .brand,.side .who{flex-shrink:0}
@media (min-width:801px){.side .tabs{min-height:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:thin}}
.nav-g{font:600 10.5px var(--f-mono);text-transform:uppercase;letter-spacing:.1em;opacity:.5;padding:12px 18px 4px 20px;white-space:nowrap}
.nav-g:first-child{padding-top:0}
@media (min-width:801px){.side:not(:hover):not(:has(:focus-visible)) .nav-g{opacity:0;height:10px;padding:0;overflow:hidden}}
@media (max-width:800px){.nav-g{display:none}}
.tab-n{margin-left:auto;font:600 11px var(--f-mono);background:var(--warn);color:#1a1200;border-radius:999px;padding:1px 7px;letter-spacing:0}
.side .who{display:grid;gap:6px;padding:14px 18px 0;border-top:1px solid #ffffff1f;font-size:13px}
.side .who .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.side .who .role{justify-self:start;font-family:var(--f-mono);font-size:11px;padding:2px 6px;border:1px solid currentColor;border-radius:3px;opacity:.8}
.side .who .acts{display:flex;gap:6px;flex-wrap:wrap}
.side .who button{display:inline-flex;align-items:center;gap:6px;background:transparent;color:var(--bar-ink);border:1px solid #ffffff40;border-radius:4px;padding:4px 10px;cursor:pointer;font-size:12.5px}
.side .who button svg{width:14px;height:14px}
/* Barra dinámica: angosta (íconos) y se expande al pasar el cursor o al navegar con teclado */
@media (min-width:801px){
  .shell{display:block;padding-left:68px}
  .side{position:fixed;left:0;top:0;bottom:0;width:68px;overflow-x:hidden;transition:width .18s ease,box-shadow .18s ease}
  .side:hover,.side:has(:focus-visible){width:236px;box-shadow:6px 0 24px #0005}
  .side .brand{padding:0 12px 0 17px;min-height:34px}
  .side .brand-t{min-width:200px}
  .side nav.tabs button{padding:10px 18px 10px 20px;white-space:nowrap}
  .side .t,.side .brand .tag,.side .who .nm,.side .who .role{white-space:nowrap;transition:opacity .12s}
  .side .brand h1{transition:opacity .12s}
  .side:not(:hover):not(:has(:focus-visible)) .who button .t{display:none}
  .side:not(:hover):not(:has(:focus-visible)) .who button{padding:6px 9px}
  .side:not(:hover):not(:has(:focus-visible)) .brand h1,.side:not(:hover):not(:has(:focus-visible)) .brand .tag,
  .side:not(:hover):not(:has(:focus-visible)) .t,.side:not(:hover):not(:has(:focus-visible)) .who .nm,.side:not(:hover):not(:has(:focus-visible)) .who .role{opacity:0;pointer-events:none}
  .side:not(:hover):not(:has(:focus-visible)) .tab-n{position:absolute;top:4px;left:38px;padding:0 5px;font-size:10px}
  .side .who{padding:14px 12px 0 14px}
  .side .who .acts{flex-direction:column;align-items:flex-start}
  .side .who button{white-space:nowrap}
}
@media (prefers-reduced-motion:reduce){.side{transition:none}}
.shell>main{flex:1;min-width:0}
@media (max-width:800px){
  .shell{display:block}
  .side{height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;gap:8px 14px;padding:calc(10px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px));overflow:visible;position:sticky}
  .side .brand{padding:0;flex:1;min-width:0}.side .brand h1{font-size:19px}.brand-t .logo,.side .brand .tag{display:none}
  .side .who{display:flex;align-items:center;gap:8px;padding:0;border:0}.side .who .nm,.side .who .t{display:none}
  nav.tabs{order:3;flex:1 0 100%;flex-direction:row;overflow-x:auto;scrollbar-width:none}
  nav.tabs button{width:auto;flex:0 0 auto;border-left:0;border-bottom:3px solid transparent;padding:8px 10px;font-size:15px}
  nav.tabs button svg,.side-toggle{display:none}
  nav.tabs button[aria-current="page"]{border-bottom-color:var(--warn);background:transparent}
}
.pagehead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.pagehead h2{font-family:var(--f-display);font-weight:600;font-size:28px;margin:0;letter-spacing:.01em}
.pagehead p{margin:4px 0 0;color:var(--muted);max-width:75ch}
.small{font-size:12px}
td.mono,td.nw{white-space:nowrap}
.lbl{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld label{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
.rep-top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.grid-2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
@media (max-width:900px){.grid-2{grid-template-columns:minmax(0,1fr)}}
.panel>.ph{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.panel>.ph h3{font-family:var(--f-display);font-weight:600;font-size:19px;margin:0}
.panel>.pb{padding:16px}
.panel:has(>.ph){padding:0}
.meter{height:6px;background:var(--surface2);border:1px solid var(--line);border-radius:3px;overflow:hidden;margin-top:10px}
.meter>i{display:block;height:100%}
/* gráfica de barras apiladas */
.chart{display:grid;gap:10px}
.ch-legend{display:flex;gap:6px 16px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.ch-legend span{display:inline-flex;align-items:center;gap:6px}
.ch-legend i,.ch-tip i{display:inline-block;width:10px;height:10px;border-radius:2px}
.ch-plot{position:relative;margin:8px 0 0 40px;border-bottom:1px solid var(--line)}
.ch-grid{position:absolute;left:0;right:0;border-top:1px solid var(--surface2)}
.ch-y{position:absolute;right:calc(100% + 8px);transform:translateY(-50%);font:11px var(--f-mono);color:var(--muted);white-space:nowrap}
.ch-cols{position:absolute;inset:0;display:flex;align-items:stretch}
.ch-col{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;border-radius:4px;outline-offset:-2px}
.ch-col:hover,.ch-col:focus-visible{background:var(--surface2)}
.ch-stack{width:min(26px,70%);display:flex;flex-direction:column-reverse;gap:2px}
.ch-stack i{display:block;min-height:2px}.ch-stack i.top{border-radius:4px 4px 0 0}
.ch-tot{font:11px var(--f-mono);color:var(--muted)}
.ch-xs{display:flex;margin-left:40px}
.ch-xs span{flex:1;min-width:0;text-align:center;font-size:11px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ch-tip{position:fixed;z-index:70;padding:8px 10px;font-size:12px;display:grid;gap:3px;pointer-events:none;box-shadow:0 4px 14px #0003}
.ch-tip div{display:flex;align-items:center;gap:6px}.ch-tip-f{color:var(--muted);margin-top:2px}
.modal-scrim{position:fixed;inset:0;background:#0009;display:grid;place-items:center;z-index:50;padding:16px}
.modal{width:min(440px,100%);max-height:90vh;overflow:auto;padding:0}
.perm-g td{background:var(--surface2)}
.eq-subs{display:flex;flex-wrap:wrap;width:fit-content;max-width:100%}
.gantt{overflow-x:auto;padding:8px 0}
.g-row{display:grid;grid-template-columns:220px minmax(560px,1fr);align-items:center;min-height:34px;border-bottom:1px solid var(--line)}
.g-row.click{cursor:pointer}.g-row.click:hover{background:var(--surface2)}
.g-head{min-height:26px;border-bottom:1px solid var(--line)}
.g-lbl{padding:4px 12px;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.g-track{position:relative;height:100%;min-height:26px;margin-right:16px}
.g-tick{position:absolute;top:6px;font:11px var(--f-mono);color:var(--muted);transform:translateX(-50%);white-space:nowrap}
.g-grid{position:absolute;top:0;bottom:0;border-left:1px dashed var(--line)}
.g-today{position:absolute;top:0;bottom:0;border-left:2px solid var(--accent);z-index:2}
.g-bar{position:absolute;top:8px;height:16px;border-radius:4px;z-index:1}
.g-plan{position:absolute;top:8px;height:16px;border:2px dashed var(--muted);border-left:0;border-radius:0 4px 4px 0;box-sizing:border-box}
.g-flag{position:absolute;top:5px;width:18px;height:18px;margin-left:-9px;border-radius:50%;background:var(--bad);color:#fff;font:700 12px/18px var(--f-body);text-align:center;z-index:3}
.movs{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,360px),1fr));gap:12px}
.mov{border:1px solid var(--line);border-left:5px solid var(--warn);border-radius:6px;background:var(--surface);padding:12px 14px;display:grid;gap:8px;min-width:0}
.mov.tipo-solicitud{border-left-color:var(--accent)}
.mov h4{margin:0;font-family:var(--f-display);font-size:19px;font-weight:600}
.mov .ruta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px}
.mov .ruta b{font-weight:600}
.mov .meta{font-size:12px;color:var(--muted)}
.mov textarea{min-height:40px}
.noaccess{min-height:70vh;display:grid;place-items:center}
.noaccess .panel{width:min(460px,100%);display:grid;gap:12px}
.datebox{display:flex;align-items:center;gap:6px}
.datebox label{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
input,select,textarea,button{font:inherit;color:inherit}
input[type=date],input[type=text],input[type=tel],input[type=email],input[type=number],select,textarea{
  background:var(--surface2);border:1px solid var(--line);border-radius:6px;padding:7px 9px;min-width:0}
textarea{width:100%;min-height:60px;resize:vertical}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main{padding-block:18px 60px}
section.view{display:flex;flex-direction:column;gap:16px}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.toolbar .grow{flex:1 1 180px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;background:var(--surface2)}
.seg button{border:0;background:none;padding:6px 12px;cursor:pointer;font-weight:500}
.seg button[aria-pressed="true"],.seg button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
.seg button+button{border-left:1px solid var(--line)}
.btn{border:1px solid var(--line);background:var(--surface2);border-radius:4px;padding:7px 13px;cursor:pointer;font:600 13px var(--f-body);white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:16px;min-width:0}
.panel h2{font-family:var(--f-display);font-weight:700;font-size:20px;margin:0 0 10px;letter-spacing:.01em}
.panel h2 .sub{font-family:var(--f-body);font-weight:500;font-size:13px;color:var(--muted);margin-left:8px}
.muted{color:var(--muted)}
.mono{font-family:var(--f-mono);font-size:12.5px}
.num{font-variant-numeric:tabular-nums}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.kpi .lbl{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.kpi .val{font-family:var(--f-display);font-weight:600;font-size:36px;line-height:1;font-variant-numeric:tabular-nums}
.kpi .hint{font-size:12.5px;color:var(--muted)}
.kpi.bad .val{color:var(--bad)} .kpi.ok .val{color:var(--ok)} .kpi.warn .val{color:var(--warn)}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--surface2);border:1px solid var(--line);white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.chip.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.chip.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.chip.info{background:var(--info-soft);color:var(--info);border-color:transparent}
.chip.acc{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;background:var(--surface2)}
tr.click{cursor:pointer} tr.click:hover td{background:var(--surface2)}
.matrix td.cell{padding:6px;min-width:130px}
.cellbox{border-radius:8px;padding:8px 10px;display:flex;flex-direction:column;gap:3px;border:1px solid var(--line);cursor:pointer;background:var(--surface);width:100%;text-align:left}
.cellbox .big{font-family:var(--f-display);font-weight:700;font-size:22px;line-height:1;font-variant-numeric:tabular-nums}
.cellbox .big span{font-size:15px;color:var(--muted);font-weight:600}
.cellbox.ok{border-left:5px solid var(--ok)} .cellbox.pend{border-left:5px solid var(--warn)} .cellbox.bad{border-left:5px solid var(--bad);background:var(--bad-soft)}
.cellbox.none{border-style:dashed;cursor:default;color:var(--muted);background:transparent}
.cellbox.sel{outline:2px solid var(--accent);outline-offset:1px}
.cellbox small{font-size:12px;color:var(--muted)}
.reqin{width:64px}
.alerts{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px}
.alert{border:1px solid var(--line);border-left:5px solid var(--bad);border-radius:8px;padding:10px 12px;background:var(--surface);display:flex;flex-direction:column;gap:6px;min-width:0}
.alert.cert{border-left-color:var(--warn)}
.alert h3{margin:0;font-family:var(--f-display);font-size:18px;font-weight:700;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.alert ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px}
.alert li{display:flex;justify-content:space-between;gap:8px;font-size:13.5px;flex-wrap:wrap}
.tel{font-family:var(--f-mono);font-size:12.5px;user-select:all}
.empty{padding:28px 12px;text-align:center;color:var(--muted)}
/* Pase de lista */
.roll{display:flex;flex-direction:column}
.rrow{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding:10px 4px;border-bottom:1px solid var(--line)}
.rrow .who{flex:1 1 220px;min-width:0}
.rrow .who b{display:block;font-weight:600}
.rrow .who span{font-size:12.5px;color:var(--muted)}
.marks{display:flex;gap:4px;flex-wrap:wrap}
.mk{width:40px;height:36px;border-radius:7px;border:1px solid var(--line);background:var(--surface2);font-family:var(--f-display);font-weight:700;font-size:17px;cursor:pointer;color:var(--muted)}
.mk:hover{border-color:var(--ink)}
.mk.on.s-A{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.mk.on.s-R{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.mk.on.s-F{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.mk.on.s-P{background:var(--warn);border-color:var(--warn);color:var(--surface)}
.mk.on.s-V{background:var(--info);border-color:var(--info);color:var(--surface)}
.mk.on.s-I{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--muted)}
.legend b{font-family:var(--f-display);font-size:15px;color:var(--ink)}
/* Drawer */
.scrim{position:fixed;inset:0;background:rgba(10,15,20,.45);z-index:20}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--surface);z-index:21;display:flex;flex-direction:column;
  border-left:1px solid var(--line);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
.drawer header{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.drawer header h2{margin:0;font-family:var(--f-display);font-size:22px;flex:1;min-width:0}
.drawer .body{overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:14px}
.drawer footer{padding:12px 16px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px}
@media (max-width:520px){.grid2{grid-template-columns:1fr}}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.field input,.field select{width:100%}
.certrow{display:grid;grid-template-columns:1.4fr 1fr 1fr auto;gap:6px;align-items:center}
@media (max-width:520px){.certrow{grid-template-columns:1fr 1fr}}
.strip{display:flex;gap:3px;flex-wrap:wrap}
.strip i{width:14px;height:20px;border-radius:3px;background:var(--surface2);border:1px solid var(--line)}
.strip i.s-A,.strip i.s-R{background:var(--ok);border-color:var(--ok)} .strip i.s-F{background:var(--bad);border-color:var(--bad)}
.strip i.s-P{background:var(--warn);border-color:var(--warn)} .strip i.s-V{background:var(--info);border-color:var(--info)} .strip i.s-I{background:var(--accent);border-color:var(--accent)}
.banner{border-radius:8px;padding:10px 14px;background:var(--warn-soft);color:var(--warn);font-weight:500}
.banner.info{background:var(--accent-soft);color:var(--accent)}
.cols2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:860px){.cols2{grid-template-columns:1fr}}
.listedit{display:flex;flex-wrap:wrap;gap:6px}
.listedit .chip button{border:0;background:none;cursor:pointer;color:inherit;padding:0 0 0 4px;font-size:14px;line-height:1}
.login{min-height:70vh;display:flex;align-items:center;justify-content:center;padding-block:40px}
.login form{width:min(380px,100%);display:flex;flex-direction:column;gap:12px}
.login h2{font-family:var(--f-display);font-size:26px;margin:0}
.who-box{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.catlayout{display:grid;grid-template-columns:230px minmax(0,1fr);gap:18px;align-items:start}
.catnav{position:sticky;top:calc(env(safe-area-inset-top,0px) + 16px);display:flex;flex-direction:column;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px}
.catnav .cat-h{font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);padding:8px 10px 4px}
.catnav button{display:flex;justify-content:space-between;align-items:center;gap:8px;border:0;background:none;text-align:left;padding:9px 10px;border-radius:7px;cursor:pointer;font-weight:500;color:var(--ink)}
.catnav button:hover{background:var(--surface2)}
.catnav button[aria-current="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.catnav button .n{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.catbody{display:flex;flex-direction:column;gap:16px;min-width:0}
.cathead{display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px 16px}
.cathead h2{font-family:var(--f-display);font-size:26px;margin:0}
.cathead p{margin:0;color:var(--muted);flex-basis:100%}
.perfiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px}
.perfil{display:flex;flex-direction:column;gap:10px}
.perfil h3{margin:0;font-family:var(--f-display);font-size:21px;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.perfil .desc{white-space:pre-wrap;margin:0}
@media (max-width:760px){.catlayout{grid-template-columns:1fr}.catnav{position:static;flex-direction:row;overflow-x:auto;padding:6px}.catnav .cat-h{display:none}.catnav button{white-space:nowrap}}
.field label.ck{display:flex;gap:6px;align-items:center;text-transform:none;letter-spacing:0;font-size:13.5px;color:var(--ink)}
.field label.ck input{width:auto;flex:none}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:8px;z-index:30;font-weight:500}
@media (prefers-reduced-motion:no-preference){.cellbox,.mk{transition:background .12s,border-color .12s}}
</style>
<style>html{color-scheme:light}body{margin:0}[hidden]{display:none!important}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
</head>
<body>
<div class="shell" id="shell">
<aside class="side" id="side" hidden>
  <div class="brand"><div class="brand-t"><img class="logo" src="img/logo.png" alt="" onerror="this.remove()"><h1>Control de Personal</h1><span class="tag">METALES · Materiales<br>Guadalajara North</span></div>
</div>
  <nav class="tabs" id="tabs" aria-label="Menú"></nav>
  <div class="who" id="who"></div>
</aside>
<main class="wrap" id="main">
  <section class="login" id="login" hidden>
    <form id="login-form" class="panel">
      <h2>Iniciar sesión</h2>
      <p class="muted" style="margin:0">Usa el correo y la contraseña que te dio el administrador.</p>
      <div class="field"><label for="lg-email">Correo</label><input id="lg-email" type="email" autocomplete="username" required></div>
      <div class="field"><label for="lg-pass">Contraseña</label><input id="lg-pass" type="password" autocomplete="current-password" required></div>
      <button class="btn primary" type="submit" id="lg-btn">Entrar</button>
      <button class="btn" type="button" id="lg-reset">Olvidé mi contraseña</button>
      <div id="lg-msg" class="muted" role="status"></div>
    </form>
  </section>
  <div id="banner"></div>
  <div class="pagehead" id="pagehead" hidden><div><h2 id="pg-title"></h2><p id="pg-sub"></p></div>
    <div class="fld" id="datebox"><label for="fecha">Fecha</label><input type="date" id="fecha"></div></div>
  <div id="noaccess" hidden></div>

  <section class="view" id="v-cobertura">
    <div id="cov-kpis" class="kpis"></div>
    <div class="toolbar">
      <span class="muted">Ver por</span>
      <div class="seg" id="cov-scope" hidden><button data-v="mi" aria-pressed="true">Mi personal</button><button data-v="todos" aria-pressed="false">Todos</button></div>
      <div class="seg" id="cov-dim"><button data-v="posicion" aria-pressed="true">Posición</button><button data-v="area" aria-pressed="false">Área</button></div>
      <select id="cov-turno" aria-label="Turno"></select>
      <select id="cov-sitio" aria-label="Sitio"></select>
      <select id="cov-sup" aria-label="Supervisor"></select>
      <span class="grow"></span>
      <button class="btn" id="cov-edit">Editar requeridos</button>
    </div>
    <div id="cov-alerts"></div>
    <div class="panel"><h2>Matriz de cobertura <span class="sub">presentes / requeridos por turno</span></h2><div id="cov-matrix" class="scroll"></div></div>
    <div id="cov-detail"></div>
  </section>

  <section class="view" id="v-lista" hidden>
    <div id="l-back" hidden></div>
    <div class="toolbar">
      <select id="l-turno" aria-label="Turno"></select>
      <select id="l-pos" aria-label="Posición"></select>
      <select id="l-area" aria-label="Área"></select>
      <select id="l-sitio" aria-label="Sitio"></select>
      <select id="l-sup" aria-label="Supervisor"></select>
      <input type="text" id="l-q" class="grow" placeholder="Buscar nombre o número">
      <button class="btn" id="l-all">Marcar pendientes como asistencia</button>
    </div>
    <div class="legend"><span><b>A</b> Asistencia</span><span><b>R</b> Retardo</span><span><b>F</b> Falta</span><span><b>P</b> Permiso</span><span><b>V</b> Vacaciones</span><span><b>I</b> Incapacidad</span><span>Toca de nuevo para quitar la marca</span></div>
    <div id="l-sum" class="toolbar"></div>
    <div class="panel" style="padding-block:4px"><div id="l-list" class="roll"></div></div>
  </section>

  <section class="view" id="v-personal" hidden>
    <div class="toolbar">
      <input type="text" id="p-q" class="grow" placeholder="Buscar nombre, número o celular">
      <select id="p-turno" aria-label="Turno"></select>
      <select id="p-pos" aria-label="Posición"></select>
      <select id="p-area" aria-label="Área"></select>
      <select id="p-sitio" aria-label="Sitio"></select>
      <select id="p-ger" aria-label="Gerente"></select>
      <select id="p-sup" aria-label="Supervisor"></select>
      <select id="p-cargo" aria-label="Cargo"></select>
      <label class="muted" style="display:flex;gap:5px;align-items:center"><input type="checkbox" id="p-bajas"> Incluir bajas</label>
      <button class="btn primary" id="p-new">Agregar persona</button>
    </div>
    <div class="panel" style="padding:0"><div id="p-table" class="scroll"></div></div>
  </section>

  <section class="view" id="v-catalogos" hidden>
    <div class="catlayout">
      <nav class="catnav" id="cat-nav" aria-label="Catálogos"></nav>
      <div class="catbody" id="cat-body"></div>
    </div>
  </section>
  <section class="view" id="v-reportes" hidden><div id="rep-root" style="display:flex;flex-direction:column;gap:16px"></div></section>
  <section class="view" id="v-vacaciones" hidden><div id="vac-root" style="display:flex;flex-direction:column;gap:16px"></div></section>
  <section class="view" id="v-te" hidden><div id="te-root" style="display:flex;flex-direction:column;gap:16px"></div></section>
  <section class="view" id="v-movimientos" hidden><div id="mov-root" style="display:flex;flex-direction:column;gap:16px"></div></section>
  <section class="view" id="v-equipos" hidden><div id="eq-root" style="display:flex;flex-direction:column;gap:16px"></div></section>
  <section class="view" id="v-s5" hidden><div id="s5-root" style="display:flex;flex-direction:column;gap:16px"></div></section>
  <section class="view" id="v-usuarios" hidden><div id="usr-root" style="display:flex;flex-direction:column;gap:16px"></div></section>
</main>
</div>
<div id="modal-root"></div>

<div id="drawer-root"></div>


<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="app.js"></script>
<script src="reportes.js"></script>
<script src="equipos.js"></script>
<script src="s5.js"></script>
</body>
</html>
